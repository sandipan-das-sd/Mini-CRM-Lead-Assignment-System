openapi: 3.1.0
info:
  title: Lead Assignment System API
  version: 1.0.0
  description: REST API for authentication, users, leads, activities, assignments, and reporting.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: Authentication
  - name: Users
  - name: Leads
  - name: Activities
  - name: Assignments
  - name: Dashboard
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is running
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Access token and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    post:
      tags: [Users]
      summary: Create a sales user (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '201':
          description: Sales user created
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Users]
      summary: List users (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: role
          in: query
          schema: { type: string, enum: [admin, sales] }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Cursor-paginated users
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}:
    get:
      tags: [Users]
      summary: View a user (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: User details }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (admin only)
      description: Deactivation fails while the user owns leads and revokes existing tokens on success.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Updated user }
        '409': { $ref: '#/components/responses/Conflict' }
  /leads:
    post:
      tags: [Leads]
      summary: Create a lead (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLead'
      responses:
        '201':
          description: Lead created or original idempotent response replayed
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Leads]
      summary: List accessible leads
      description: Admin sees all leads; a sales user sees only their assigned leads.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeadStatus' } }
        - { name: source, in: query, schema: { type: string } }
        - { name: assignedUserId, in: query, schema: { type: integer } }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Cursor-paginated leads }
  /leads/{id}:
    get:
      tags: [Leads]
      summary: View an accessible lead
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: Lead details }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Leads]
      summary: Update an accessible lead
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LeadInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated lead }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /leads/{id}/status:
    patch:
      tags: [Leads]
      summary: Change lead status
      description: Converted and lost are terminal statuses.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { $ref: '#/components/schemas/LeadStatus' }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Status changed and activity recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leads/{leadId}/activities:
    get:
      tags: [Activities]
      summary: View lead history
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Newest-first activity timeline }
        '404': { $ref: '#/components/responses/NotFound' }
  /leads/{leadId}/activities/notes:
    post:
      tags: [Activities]
      summary: Add a note to an accessible lead
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { description: Note activity created }
        '404': { $ref: '#/components/responses/NotFound' }
  /leads/{leadId}/assignment:
    post:
      tags: [Assignments]
      summary: Assign or reassign a lead (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedUserId, version]
              properties:
                assignedUserId: { type: integer, minimum: 1 }
                version: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Lead assigned and history recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /leads/{leadId}/reassignment-requests:
    post:
      tags: [Assignments]
      summary: Request lead reassignment (sales only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                requestedToUserId: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Reassignment request created }
        '409': { $ref: '#/components/responses/Conflict' }
  /reassignment-requests:
    get:
      tags: [Assignments]
      summary: List reassignment requests (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled] }
      responses:
        '200': { description: Cursor-paginated requests }
  /reassignment-requests/{id}:
    patch:
      tags: [Assignments]
      summary: Approve or reject a request (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                assignedUserId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Request reviewed; approval performs reassignment atomically }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get lead statistics
      description: Sales users receive statistics only for their assigned leads.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Totals, status counts, conversion/loss counts, and salesperson counts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
  schemas:
    LeadStatus:
      type: string
      enum: [new, contacted, interested, follow_up, converted, lost]
    LeadInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        source: { type: string, maxLength: 80 }
    CreateLead:
      allOf:
        - $ref: '#/components/schemas/LeadInput'
        - type: object
          required: [name, source]
          anyOf:
            - required: [phone]
            - required: [email]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, sales] }
        isActive: { type: boolean }
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            tokenType: { type: string, const: Bearer }
            user: { $ref: '#/components/schemas/User' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user lacks the required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found or not accessible to this user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Duplicate, stale version, or conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation or business-rule failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many login attempts; retry after the number of seconds in Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
