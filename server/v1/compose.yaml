services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lead_assignment
      MYSQL_USER: lead_app
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pchange-root-password']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
