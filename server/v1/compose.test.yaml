name: leadflow-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lead_assignment_test
      MYSQL_USER: lead_test
      MYSQL_PASSWORD: lead_test_password
      MYSQL_ROOT_PASSWORD: test_root_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-ptest_root_password']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build: .
    command: sh -c "npm run db:migrate && npm run test:db"
    environment:
      NODE_ENV: test
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lead_assignment_test
      DB_USER: lead_test
      DB_PASSWORD: lead_test_password
      JWT_SECRET: test-only-secret-that-is-at-least-thirty-two-characters
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173
      SMTP_HOST: ''
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
